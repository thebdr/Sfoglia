[package]
name = "sfoglia"
version = "0.1.0"
edition = "2024"
description = "Sfoglia: a viewer for any file, with editing where it is worth it."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# tree-sitter-languages: every grammar the kit ships, for the text viewer (C-005).
gpui-kit = { version = "0.7.3", features = ["tree-sitter-languages"] }
# Highlighting rules (C-006): regex patterns in a TOML file, scoped by file-name globs.
regex = "1"
globset = "0.4"
toml = "1"
serde = { version = "1", features = ["derive"] }
dirs = "6"
# Hex view (C-007): the file is mapped, not read; search is memmem.
memmap2 = "0.9"
memchr = "2"

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["tree-sitter-languages", "test-support"] }

[workspace]
members = ["xtask"]
# A bare `cargo test` must run the checklist freshness check in xtask too (C-002).
default-members = [".", "xtask"]
