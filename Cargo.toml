[package]
name = "sfoglia"
version = "0.1.0"
edition = "2024"
description = "Sfoglia: a viewer for any file, with editing where it is worth it."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# tree-sitter-languages: every grammar the kit ships, for the text viewer (C-005).
gpui-kit = { version = "0.7.3", features = ["tree-sitter-languages"] }
# Highlighting rules (C-006): regex patterns in a TOML file, scoped by file-name globs.
regex = "1"
globset = "0.4"
toml = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
dirs = "6"
# Hex view (C-007): the file is mapped, not read; search is memmem.
memmap2 = "0.9"
memchr = "2"
# Images (C-009): the same decoders the kit's GPUI enables, EXIF, gzip for svgz, font names.
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
kamadak-exif = "0.6"
flate2 = "1"
ttf-parser = "0.25"
usvg = "0.46"
resvg = "0.46"
# Structured data trees (C-010): serde_json checks the JSON (numbers of any size), XML as a read-only DOM, YAML as a
# typed document tree, TOML in file order.
serde_json = { version = "1", features = ["arbitrary_precision"] }
roxmltree = "0.21"
saphyr = "0.2"
toml_edit = "0.25"
saphyr-parser = "0.2"
markdown = "1.0"
ureq = "3"
futures = "0.3"
anyhow = "1"
calamine = "0.36.1"
csv = "1.4.0"
zip = { version = "9", default-features = false, features = ["aes-crypto", "deflate", "bzip2", "zstd", "lzma", "time"] }
tar = "0.4"
bzip2 = "0.6"
liblzma = { version = "0.4", default-features = false, features = ["static"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zstd = "0.14"
sevenz-rust2 = { version = "0.24", features = ["aes256"] }
# PDF (C-014): the window handle SumatraPDF is hosted under, and the Win32 calls that place its frame and read a tool's version resource.

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["tree-sitter-languages", "test-support"] }
# The tests write an APNG the image crate cannot encode (C-009).
png = "0.18"

[workspace]
members = ["xtask"]
# A bare `cargo test` must run the checklist freshness check in xtask too (C-002).
default-members = [".", "xtask"]

# Debug info: line tables for our crates, none for the dependencies. With full debug info the
# test binaries' program databases reached half a gigabyte each and, once the data parsers of
# C-010 joined, the MSVC linker refused them (LNK1140, program database limit exceeded).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
