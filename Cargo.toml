[package]
name = "sfoglia"
version = "0.1.0"
edition = "2024"
description = "Sfoglia: a viewer for any file, with editing where it is worth it."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# tree-sitter-languages: every grammar the kit ships, for the text viewer (C-005).
gpui-kit = { version = "0.7.3", features = ["tree-sitter-languages"] }
# Highlighting rules (C-006): regex patterns in a TOML file, scoped by file-name globs.
regex = "1"
globset = "0.4"
toml = "1"
serde = { version = "1", features = ["derive"] }
dirs = "6"
# Hex view (C-007): the file is mapped, not read; search is memmem.
memmap2 = "0.9"
memchr = "2"
# Images (C-009): the same decoders the kit's GPUI enables, EXIF, gzip for svgz, font names.
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
kamadak-exif = "0.6"
flate2 = "1"
ttf-parser = "0.25"
usvg = "0.46"
resvg = "0.46"

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["tree-sitter-languages", "test-support"] }
# The tests write an APNG the image crate cannot encode (C-009).
png = "0.18"

[workspace]
members = ["xtask"]
# A bare `cargo test` must run the checklist freshness check in xtask too (C-002).
default-members = [".", "xtask"]
