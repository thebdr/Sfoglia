[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
description = "Repository tasks: `cargo run -p xtask -- formats` regenerates FORMATS.md from .zen/contract.md"

[dependencies]
bzip2 = "0.6"
flate2 = "1"
lzma-rs = "0.3"
rust_xlsxwriter = "0.100.0"
sevenz-rust2 = { version = "0.24", features = ["aes256", "compress"] }
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate", "bzip2", "zstd", "time"] }
zstd = "0.14"
